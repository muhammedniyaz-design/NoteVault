{% extends "base.html" %}
{% block title %}{{ 'Edit' if note else 'New' }} Note — NoteVault{% endblock %}
{% block content %}
<section class="auth-form">
  <h2>{{ 'Edit Note' if note else 'New Note' }}</h2>
  <form method="POST">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ note.title if note else '' }}" required autofocus>

    <label for="category">Category</label>
    <select id="category" name="category">
      {% for c in categories %}
        <option value="{{ c }}" {% if note and note.category == c %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>

    <label for="tags">Tags (comma-separated)</label>
    <input type="text" id="tags" name="tags" value="{{ note.tags if note else '' }}" placeholder="exam, chapter3">

    <label for="content">Content</label>
    <textarea id="content" name="content" rows="10" required>{{ note.content if note else '' }}</textarea>

    <button type="submit" class="btn btn-primary">{{ 'Save Changes' if note else 'Create Note' }}</button>
  </form>
</section>
{% endblock %}
